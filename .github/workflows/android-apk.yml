name: Build Spencers Enterprices Android APK

on:
  push:
    branches:
      - feat/eggsclusive-production-mvp
    paths:
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"
      - "android/README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm ci

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web asset directory
        run: mkdir -p dist

      - name: Add Android project when not already initialized
        run: |
          if [ ! -f android/build.gradle ] && [ ! -f android/build.gradle.kts ]; then
            # The repository currently contains only android/README.md, not a native project.
            rm -rf android
            npx cap add android
          else
            echo "Existing Android native project detected; keeping it."
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spencers-Enterprices-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
