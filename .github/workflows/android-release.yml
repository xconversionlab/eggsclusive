name: Build Spencers Enterprises Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build and verify signed Android release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q "$RUNNER_TEMP/gradle.zip" -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          KEYSTORE_PATH="$RUNNER_TEMP/spencers-enterprises-release.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded. Replace it with the complete contents of ANDROID_KEYSTORE_BASE64.txt."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::The decoded keystore file is empty."
            exit 1
          fi

          EXPECTED_KEYSTORE_SHA256="9d9406ff42523beb50089d78234137100e317874736402367083ee6d43c58e13"
          ACTUAL_KEYSTORE_SHA256="$(sha256sum "$KEYSTORE_PATH" | awk '{print $1}')"
          if [ "$ACTUAL_KEYSTORE_SHA256" != "$EXPECTED_KEYSTORE_SHA256" ]; then
            echo "::error::The decoded keystore does not match the generated signing file. Re-copy the full ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore file checksum matches."

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>"$RUNNER_TEMP/store-validation.err"; then
            echo "::error::Keystore file is correct, but ANDROID_KEYSTORE_PASSWORD was rejected. Copy the Keystore password exactly from SIGNING_CREDENTIALS.txt."
            cat "$RUNNER_TEMP/store-validation.err"
            exit 1
          fi
          echo "Keystore password accepted."

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/alias-validation.err"; then
            echo "::error::ANDROID_KEY_ALIAS was not found in this keystore. Set it to spencers-release exactly."
            cat "$RUNNER_TEMP/alias-validation.err"
            exit 1
          fi
          echo "Key alias accepted."
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: native-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature and create checksum
        run: |
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: Spencers-Enterprises-Android-Release-1.2.6
          path: |
            native-android/app/build/outputs/apk/release/app-release.apk
            native-android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key from runner
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            rm -f "$ANDROID_KEYSTORE_FILE"
          fi
