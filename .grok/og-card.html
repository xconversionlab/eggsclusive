<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-Italic.ttf") format("truetype");
        font-weight: 400;
        font-style: italic;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #f3eee4;
        color: #1c1915;
      }
      .card {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 88px 120px 96px;
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(28, 25, 21, 0.38);
        pointer-events: none;
      }
      .frame-inner {
        position: absolute;
        inset: 34px;
        border: 1px solid rgba(28, 25, 21, 0.16);
        pointer-events: none;
      }
      .kicker {
        margin: 0 0 22px;
        font-family: "Liberation Sans", sans-serif;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.46em;
        text-transform: uppercase;
        text-indent: 0.46em;
      }
      .egg {
        display: block;
        margin: 0 0 18px;
      }
      h1 {
        margin: 0;
        font-family: "Instrument Serif", "Liberation Serif", serif;
        font-weight: 400;
        font-size: 142px;
        line-height: 0.86;
        letter-spacing: 0.01em;
      }
      .rule {
        display: flex;
        align-items: center;
        width: 280px;
        margin: 26px 0 18px;
      }
      .rule i {
        flex: 1;
        height: 1px;
        background: #1c1915;
        opacity: 0.45;
      }
      .rule b {
        width: 5px;
        height: 5px;
        margin: 0 12px;
        border-radius: 50%;
        background: #b86a12;
        display: block;
      }
      .tag {
        margin: 0;
        font-family: "Instrument Serif", "Liberation Serif", serif;
        font-style: italic;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 0.01em;
      }
      .foot {
        position: absolute;
        bottom: 52px;
        margin: 0;
        font-family: "Liberation Sans", sans-serif;
        font-size: 12px;
        letter-spacing: 0.38em;
        text-indent: 0.38em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame"></div>
      <div class="frame-inner"></div>
      <p class="kicker">Chennai mornings</p>
      <svg class="egg" width="34" height="44" viewBox="0 0 32 42" aria-hidden="true">
        <path
          fill="#1C1915"
          d="M16 1.2C9.4 1.2 4.2 11 4.2 18.6 4.2 28.2 9.4 40.6 16 40.6s11.8-12.4 11.8-22C27.8 11 22.6 1.2 16 1.2z"
        />
        <circle cx="16" cy="23.2" r="4.1" fill="#B86A12" />
      </svg>
      <h1>EGGSCLUSIVE</h1>
      <div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
      <p class="tag">Neighbourhood eggs, still warm.</p>
      <p class="foot">Door to door</p>
    </div>
  </body>
</html>
